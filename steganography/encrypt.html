<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Embed Message | StegaTool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#2a0620] text-pink-100 min-h-screen flex">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-[#3b0a2a] p-6 hidden md:block">
    <h1 class="text-xl font-bold text-pink-300">StegaTool</h1>
    <p class="text-xs text-pink-400 mb-6">Digital Steganography</p>

    <nav class="space-y-2 text-sm">
      <a href="/index.html" class="block hover:underline">← Dashboard</a>
      <a class="block bg-pink-600 rounded px-3 py-2">Embed Message</a>
      <a href="decrypt.html" class="block hover:underline">Extract Message</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-8 max-w-3xl">

    <h2 class="text-2xl font-bold text-pink-300 mb-4">Embed Message</h2>

    <div class="space-y-4 bg-[#3b0a2a] p-6 rounded-xl border border-pink-800">

      <input type="file" id="mediaFile" class="block w-full text-sm">

      <textarea id="secretMessage"
        class="w-full p-2 rounded text-black"
        placeholder="Pesan rahasia"></textarea>

      <input type="password" id="encodePassword"
        class="w-full p-2 rounded text-black"
        placeholder="Password (opsional)">

      <button id="encodeBtn"
        class="w-full py-3 bg-pink-600 rounded font-semibold">
        Embed Message
      </button>

      <div id="encodeResult" class="hidden pt-4 border-t border-pink-800">
        <button id="downloadEncoded" class="underline text-pink-300">
          Download Hasil
        </button>
      </div>

      <p class="text-xs text-pink-400">
        Supported: PNG, JPG, PDF, DOCX, XLSX, MP3
      </p>
    </div>

  </main>

  <!-- SCRIPT WAJIB -->
  <script src="../stego.js"></script>

  <script>
    const mediaFile = document.getElementById("mediaFile");
    const secretMessage = document.getElementById("secretMessage");
    const encodePassword = document.getElementById("encodePassword");
    const encodeBtn = document.getElementById("encodeBtn");
    const encodeResult = document.getElementById("encodeResult");
    const downloadEncoded = document.getElementById("downloadEncoded");

    let selectedFile, encodedBlob;

    mediaFile.onchange = e => selectedFile = e.target.files[0];

    encodeBtn.onclick = async () => {
      if (!selectedFile || !secretMessage.value) {
        alert("Lengkapi input");
        return;
      }

      try {
        encodedBlob = selectedFile.type.startsWith("image/")
          ? await encodeMessageToImage(
              selectedFile,
              secretMessage.value,
              encodePassword.value
            )
          : await encodeMessageToBinary(
              selectedFile,
              secretMessage.value,
              encodePassword.value
            );

        encodeResult.classList.remove("hidden");
      } catch (e) {
        alert("Gagal embed: " + e);
      }
    };

    downloadEncoded.onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(encodedBlob);
      a.download = "stego_" + selectedFile.name;
      a.click();
    };
  </script>
</body>
</html>
